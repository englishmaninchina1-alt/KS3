      // Register the offline service worker. Dev servers and the cloud preview
      // are skipped so a stale cached shell can never mask live edits.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var host = location.hostname;
        var isDevHost =
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host === '0.0.0.0' ||
          host === '' ||
          /\.style\.dev$/.test(host) ||
          /\.local$/.test(host);
        if (isDevHost) return;
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            // Offline support is a bonus: the app still works online without it.
          });
        });
      })();
    </script>
